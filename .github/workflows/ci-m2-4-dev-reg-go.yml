name: CI M2-4 Dev Reg

# m2-4-dev-reg-go 设备注册服务：初始化窗口与预设读库、SSID 指纹校验、设备创建与
# root_key 签发、bitmap 递增；与 m0-1-center-go 握手（注册/心跳/状态/配置拉取）。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要校验的 lot-manager-aio ref（分支 / tag / commit SHA）"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-m2-4-dev-reg-go-${{ github.event.inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
    steps:
      - name: Checkout private workspace
        uses: actions/checkout@v4
        with:
          repository: joyanhui/lot-manager-aio
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch private workspace to requested ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            workspace/go.work.sum
            workspace/lot-shared-lib/golang/go.sum
            workspace/m2-4-dev-reg-go/go.sum

      - name: Vet m2-4-dev-reg-go
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          go vet ./m2-4-dev-reg-go/... ./lot-shared-lib/golang/...

      - name: Build m2-4-dev-reg-go
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          go build ./m2-4-dev-reg-go/... ./lot-shared-lib/golang/...

      - name: Run m2-4-dev-reg-go tests
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          go test ./m2-4-dev-reg-go/... ./lot-shared-lib/golang/...
