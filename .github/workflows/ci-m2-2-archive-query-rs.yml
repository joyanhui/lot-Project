name: CI M2-2 Archive Query Rs

# m2-2-archive-query-rs 归档查询层：ingest 写入 DuckDB 热库（按天/小时分片），
# convert 队列用 DuckDB COPY 生成 Parquet，upload 队列 token bucket 限速 multipart 上传主 S3，
# hotcloud-backup 备份 sealed 热库，cleanup 按保留天数清理，device-status 同步设备活跃状态。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要校验的 lot-aio ref（分支 / tag / commit SHA）"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-m2-2-archive-query-rs-${{ github.event.inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
    steps:
      - name: Checkout private workspace
        uses: actions/checkout@v4
        with:
          repository: joyanhui/lot-aio
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch private workspace to requested ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lot-rust-host
          workspaces: |
            workspace -> target

      - name: Validate workspace metadata
        working-directory: workspace
        shell: bash
        run: cargo metadata --format-version 1 --no-deps

      - name: Check m2-2-archive-query-rs
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          env -u CARGO_INCREMENTAL cargo check -p m2-2-archive-query-rs
          mkdir -p /tmp/lot-cfg
          cp cfg.lot.v3.lua /tmp/lot-cfg/cfg.lot.v3.lua
          export LOT_CFG_DIR=/tmp/lot-cfg
          cargo build -p m2-2-archive-query-rs
          ./target/debug/m2-2-archive-query-rs --config-check
          if env -u LOT_CFG_DIR ./target/debug/m2-2-archive-query-rs --config-check >/dev/null 2>&1; then echo "missing LOT_CFG_DIR must fail"; exit 1; fi
          if LOT_CFG_DIR="" ./target/debug/m2-2-archive-query-rs --config-check >/dev/null 2>&1; then echo "empty LOT_CFG_DIR must fail"; exit 1; fi
          if LOT_CFG_DIR=/tmp/lot-cfg-absent ./target/debug/m2-2-archive-query-rs --config-check >/dev/null 2>&1; then echo "missing config file must fail"; exit 1; fi
          mkdir -p /tmp/lot-cfg-invalid
          printf 'return { unknown_module = 1 }\n' > /tmp/lot-cfg-invalid/cfg.lot.v3.lua
          if LOT_CFG_DIR=/tmp/lot-cfg-invalid ./target/debug/m2-2-archive-query-rs --config-check >/dev/null 2>&1; then echo "invalid config must fail"; exit 1; fi
