name: CI M1-9 Ops Panel Rs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要校验的 lot-manager-aio ref（分支 / tag / commit SHA）"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-m1-9-ops-panel-rs-${{ github.event.inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
    steps:
      - name: Checkout private workspace
        uses: actions/checkout@v4
        with:
          repository: joyanhui/lot-manager-aio
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch private workspace to requested ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        working-directory: workspace
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend-ops
        working-directory: workspace/m1-9-ops-panel-rs/frontend-ops
        shell: bash
        run: |
          set -euo pipefail
          pnpm run openapi:gen
          pnpm run typecheck

      - name: Lint frontend-ops
        working-directory: workspace/m1-9-ops-panel-rs/frontend-ops
        shell: bash
        run: pnpm run lint

      - name: Build frontend-ops
        working-directory: workspace/m1-9-ops-panel-rs/frontend-ops
        shell: bash
        run: pnpm run build

      - name: Rust check m1-9-ops-panel-rs
        working-directory: workspace
        shell: bash
        run: cargo check -p m1-9-ops-panel-rs
