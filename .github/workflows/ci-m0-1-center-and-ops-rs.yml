name: CI M0-1 Center and Ops Rs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要校验的 lot-aio ref（分支 / tag / commit SHA）"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-m0-1-center-and-ops-rs-${{ github.event.inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
    steps:
      - name: Checkout private workspace
        uses: actions/checkout@v4
        with:
          repository: joyanhui/lot-aio
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch private workspace to requested ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        working-directory: workspace
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck ops-ui
        working-directory: workspace/frontend/ops-ui
        shell: bash
        run: |
          set -euo pipefail
          pnpm run openapi:gen
          pnpm run typecheck

      - name: Lint ops-ui
        working-directory: workspace/frontend/ops-ui
        shell: bash
        run: pnpm run lint

      - name: Build ops-ui
        working-directory: workspace/frontend/ops-ui
        shell: bash
        run: pnpm run build

      - name: Rust check m0-1-center-and-ops-rs
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lot-cfg
          cp cfg.lot.v3.lua /tmp/lot-cfg/cfg.lot.v3.lua
          export LOT_CFG_DIR=/tmp/lot-cfg
          cargo check -p m0-1-center-and-ops-rs
          cargo build -p m0-1-center-and-ops-rs
          ./target/debug/m0-1-center-and-ops-rs --config-check
          if env -u LOT_CFG_DIR ./target/debug/m0-1-center-and-ops-rs --config-check >/dev/null 2>&1; then echo "missing LOT_CFG_DIR must fail"; exit 1; fi
          if LOT_CFG_DIR="" ./target/debug/m0-1-center-and-ops-rs --config-check >/dev/null 2>&1; then echo "empty LOT_CFG_DIR must fail"; exit 1; fi
          if LOT_CFG_DIR=/tmp/lot-cfg-absent ./target/debug/m0-1-center-and-ops-rs --config-check >/dev/null 2>&1; then echo "missing config file must fail"; exit 1; fi
          mkdir -p /tmp/lot-cfg-invalid
          printf 'return { unknown_module = 1 }\n' > /tmp/lot-cfg-invalid/cfg.lot.v3.lua
          if LOT_CFG_DIR=/tmp/lot-cfg-invalid ./target/debug/m0-1-center-and-ops-rs --config-check >/dev/null 2>&1; then echo "invalid config must fail"; exit 1; fi
