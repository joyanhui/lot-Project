name: 设备侧全链路压测

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 压测目标（m12 设备 API / m21-m22 设备接入 / full 全链路）
        required: true
        default: full
        type: choice
        options:
          - full
          - m12
          - m21-m22
      m12_mode:
        description: m1-2 压测模式（register/pull/check/alarm/assign/mixed）
        default: mixed
        required: false
        type: choice
        options:
          - mixed
          - register
          - pull
          - check
          - alarm
          - assign
      m12_workers:
        description: m1-2 压测并发 worker 数
        default: "16"
        required: false
        type: string
      m12_dur:
        description: m1-2 压测时长（秒）
        default: "60"
        required: false
        type: string
      m21_count:
        description: m2 设备模拟数量
        default: "2000"
        required: false
        type: string
      m21_warmup_dur:
        description: m2 预热时长（秒，触发 root key 拉取；冷环境建议 ≥60）
        default: "60"
        required: false
        type: string
      m21_dur:
        description: m2 稳态压测时长（秒）
        default: "60"
        required: false
        type: string
      source_ref:
        description: 源码 ref（如 main）
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  PRIVATE_RELEASE_REPO: joyanhui/lot-manager-aio
  SOURCE_REF: ${{ inputs.source_ref }}

concurrency:
  group: ab-m12-m21-m22
  cancel-in-progress: false

jobs:
  ab-test:
    name: ab-test device full-chain (${{ inputs.test_target }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m1_1_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - name: Checkout lot-manager-aio
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_RELEASE_REPO }}
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch to requested source ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build m0-1 / m1-2 / m2-1 / m2-2 via dev.sh
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -c "
            bash script/dev.sh build:m0-1-center-rs x86_64
            bash script/dev.sh build:m1-2-device-api-rs x86_64
            bash script/dev.sh build:m2-1-listener-rs x86_64
            bash script/dev.sh build:m2-2-archive-query-rs x86_64
          "

      - name: Initialize database schema
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          for f in migration/migrations/V*.sql; do
            if ! PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -f "$f" >/tmp/mig.out 2>&1; then
              if grep -q "already exists" /tmp/mig.out; then
                echo "ignored idempotent conflict: $(basename "$f")"
              else
                echo "::error::migration failed: $(basename "$f")"
                tail -10 /tmp/mig.out
                exit 1
              fi
            fi
          done
          MAXV=$(ls migration/migrations/V*.sql | sed 's/.*\/V0*\([0-9]*\)__.*/\1/' | sort -n | tail -1)
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -c "CREATE TABLE IF NOT EXISTS refinery_schema_history (version INT PRIMARY KEY, name VARCHAR(255), checksum VARCHAR(64), applied_at TIMESTAMPTZ DEFAULT now());"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -c "INSERT INTO refinery_schema_history (version, name, checksum) VALUES (${MAXV}, 'ci_schema_initialized', '') ON CONFLICT (version) DO NOTHING;"
          echo "schema initialized"

      - name: Prepare test users
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/loadtest
          python3 ab-test/m1-1-app-api-rs/online-20k/prep.py
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -f /tmp/loadtest/insert_users.sql

      - name: Prepare m1-2 test data
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -c "INSERT INTO device_types (id, type_code, type_name, description, default_config_json, capabilities_json, created_at) VALUES (1, 'loadtest', 'Loadtest Device', '', '{}', '{}', now()) ON CONFLICT (id) DO NOTHING;"
          python3 ab-test/m1-2-device-api-rs/prep.py
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -f /tmp/loadtest/m12_init.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -f /tmp/loadtest/m12_insert_devices.sql

      - name: Prepare m2 test devices
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 ab-test/m2-1-m2-2-devices-20k/prep_devices.py
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d m1_1_platform -f /tmp/loadtest/insert_devices.sql

      - name: Build M3 API load and fleet simulators
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -c "
            cargo build --release -p lot-manager-m3-simulator --bin m3-api-load --bin m3-fleet
          "

      - name: Start services and run ab test
        working-directory: workspace
        shell: bash
        env:
          TEST_TARGET: ${{ inputs.test_target }}
          M12_MODE: ${{ inputs.m12_mode }}
          M12_WORKERS: ${{ inputs.m12_workers }}
          M12_DUR: ${{ inputs.m12_dur }}
          M21_COUNT: ${{ inputs.m21_count }}
          M21_WARMUP_DUR: ${{ inputs.m21_warmup_dur }}
          M21_DUR: ${{ inputs.m21_dur }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/loadtest
          cp config.lot.v2.json5 dist/stage/x86_64/config.lot.v2.json5
          cp config.lot.v2.json5 target/release/config.lot.v2.json5
          nix develop --command bash -c '
            set -euo pipefail
            trap "pkill -f m0-1-center 2>/dev/null || true; pkill -f m1-2-device-api 2>/dev/null || true; pkill -f m2-2-archive-query 2>/dev/null || true; pkill -f m2-1-listener 2>/dev/null || true" EXIT

            ./dist/stage/x86_64/m0-1-center-rs > /tmp/loadtest/m0.log 2>&1 &
            sleep 4
            echo "--- m0-1 log ---"; tail -3 /tmp/loadtest/m0.log || true

            if [ "${TEST_TARGET}" = "m12" ] || [ "${TEST_TARGET}" = "full" ]; then
              echo "== m1-2 ${M12_MODE} test ${M12_DUR}s =="
              ./target/release/m1-2-device-api-rs > /tmp/loadtest/m12.log 2>&1 &
              M12_PID=$!
              sleep 6
              echo "--- m1-2 log ---"; tail -5 /tmp/loadtest/m12.log || true
              bash ab-test/m1-2-device-api-rs/monitor.sh /tmp/loadtest/monitor-m12.csv "${M12_DUR}" m1-2-device-api-rs m0-1-center-rs > /tmp/loadtest/monitor-m12.log 2>&1 &
              MON12_PID=$!
              ./target/release/m3-api-load --mode "${M12_MODE}" --workers "${M12_WORKERS}" --duration-secs "${M12_DUR}" --base http://127.0.0.1:19312 --devices /tmp/loadtest/m12_devices.jsonl 2>&1 | tee /tmp/loadtest/m12-loader.log
              kill ${MON12_PID} 2>/dev/null || true
              kill ${M12_PID} 2>/dev/null || true
              echo "--- m1-2 log tail ---"; tail -8 /tmp/loadtest/m12.log || true
            fi

            if [ "${TEST_TARGET}" = "m21-m22" ] || [ "${TEST_TARGET}" = "full" ]; then
              echo "== m2-1/m2-2 steady test ${M21_DUR}s =="
              ./target/release/m2-2-archive-query-rs > /tmp/loadtest/m22.log 2>&1 &
              M22_PID=$!
              sleep 4
              ./target/release/m2-1-listener-rs > /tmp/loadtest/m21.log 2>&1 &
              M21_PID=$!
              sleep 8
              echo "--- m2-1 log ---"; tail -5 /tmp/loadtest/m21.log || true
              ./target/release/m3-fleet --count "${M21_COUNT}" --duration-secs "${M21_WARMUP_DUR}" --devices /tmp/loadtest/devices.jsonl > /tmp/loadtest/warmup.log 2>&1
              sleep 15
              bash ab-test/m2-1-m2-2-devices-20k/monitor.sh /tmp/loadtest/monitor-m2.csv "${M21_DUR}" m2-1-listener-rs m2-2-archive-query-rs m0-1-center-rs > /tmp/loadtest/monitor-m2.log 2>&1 &
              MON2_PID=$!
              ./target/release/m3-fleet --count "${M21_COUNT}" --duration-secs "${M21_DUR}" --devices /tmp/loadtest/devices.jsonl 2>&1 | tee /tmp/loadtest/m3-fleet.log
              kill ${MON2_PID} 2>/dev/null || true
              kill ${M21_PID} ${M22_PID} 2>/dev/null || true
              echo "--- m2-1 log tail ---"; tail -8 /tmp/loadtest/m21.log || true
              echo "--- m2-2 log tail ---"; tail -5 /tmp/loadtest/m22.log || true
            fi

            echo "--- m0-1 log tail ---"; tail -3 /tmp/loadtest/m0.log || true
          '

      - name: Upload ab-test results
        uses: actions/upload-artifact@v4
        with:
          name: ab-test-device-fullchain-${{ inputs.test_target }}-${{ github.run_id }}
          path: |
            /tmp/loadtest/m12-loader.log
            /tmp/loadtest/monitor-m12.csv
            /tmp/loadtest/m3-fleet.log
            /tmp/loadtest/warmup.log
            /tmp/loadtest/monitor-m2.csv
            /tmp/loadtest/m0.log
            /tmp/loadtest/m12.log
            /tmp/loadtest/m21.log
            /tmp/loadtest/m22.log
          if-no-files-found: warn
