name: Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 是否发布到 release
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      release_tag:
        description: 发布 tag（如 v0.1.0）
        default: 'v0.1.0'
        required: true
        type: string
      source_ref:
        description: 源码 ref（如 v0.1.0 或 main）
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: true

env:
  PRIVATE_RELEASE_REPO: joyanhui/lot-manager-aio
  PUBLISH_RELEASE: ${{ inputs.publish_release }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  SOURCE_REF: ${{ inputs.source_ref }}

jobs:
  prepare-private-release:
    name: Prepare private lot-manager-aio release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure private release exists when publishing
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GH }}
        run: |
          set -euo pipefail
          release_tag="${{ env.RELEASE_TAG }}"
          if gh release view "${release_tag}" -R "${PRIVATE_RELEASE_REPO}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${release_tag}" -R "${PRIVATE_RELEASE_REPO}" --title "${release_tag}" --notes "" || gh release view "${release_tag}" -R "${PRIVATE_RELEASE_REPO}" >/dev/null 2>&1

  build-x86_64:
    name: Build linux_x86.tar.zst via dev.sh build:all
    needs: prepare-private-release
    runs-on: ubuntu-latest
    env:
      TOKEN_GH: ${{ secrets.TOKEN_GH }}
      OUTPUT_NAME: linux_x86.tar.zst
    steps:
      - name: Checkout lot-manager-aio workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_RELEASE_REPO }}
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch workspace to requested source ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: workspace/.embuild
          key: embuild-${{ hashFiles('workspace/Cargo.lock') }}

      - name: Build all targets and package archive
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            set -euo pipefail
            rustup default stable
            rustup toolchain install nightly-2026-05-08 --profile minimal --component rust-src
            bun install --frozen-lockfile
            bash script/dev.sh build:all
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86-archive
          path: dist/linux_x86.tar.zst*
          if-no-files-found: error

      - name: Upload to private release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GH }}
        run: |
          set -euo pipefail
          bash .github/script/gh-release.sh upload \
            "${RELEASE_TAG}" \
            "${PRIVATE_RELEASE_REPO}" \
            dist/linux_x86.tar.zst \
            dist/linux_x86.tar.zst.sha256

  build-arm64:
    name: Build linux_arm64.tar.zst via dev.sh build:all arm64
    needs: prepare-private-release
    runs-on: ubuntu-latest
    env:
      TOKEN_GH: ${{ secrets.TOKEN_GH }}
      OUTPUT_NAME: linux_arm64.tar.zst
    steps:
      - name: Checkout lot-manager-aio workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_RELEASE_REPO }}
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch workspace to requested source ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: workspace/.embuild
          key: embuild-${{ hashFiles('workspace/Cargo.lock') }}

      - name: Build all targets and package archive
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            set -euo pipefail
            rustup default stable
            rustup target add aarch64-unknown-linux-musl aarch64-linux-android
            rustup toolchain install nightly-2026-05-08 --profile minimal --component rust-src
            export CC_aarch64_unknown_linux_musl="$(
              nix build --no-link --print-out-paths \
                "nixpkgs#pkgsCross.aarch64-multiplatform-musl.buildPackages.gcc"
            )/bin/aarch64-unknown-linux-musl-gcc"
            bun install --frozen-lockfile
            bash script/dev.sh build:all arm64
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-archive
          path: dist/linux_arm64.tar.zst*
          if-no-files-found: error

      - name: Upload to private release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GH }}
        run: |
          set -euo pipefail
          bash .github/script/gh-release.sh upload \
            "${RELEASE_TAG}" \
            "${PRIVATE_RELEASE_REPO}" \
            dist/linux_arm64.tar.zst \
            dist/linux_arm64.tar.zst.sha256

  build-ios:
    name: Build iOS simulator .app.ipa
    needs: prepare-private-release
    runs-on: macos-latest
    env:
      TOKEN_GH: ${{ secrets.TOKEN_GH }}
      OUTPUT_NAME: m4-1-userApp-tauri-ios-simulator.app.ipa
    steps:
      - name: Checkout lot-manager-aio workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_RELEASE_REPO }}
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch workspace to requested source ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple targets
        shell: bash
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install workspace dependencies
        working-directory: workspace
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build shared frontend assets
        working-directory: workspace/frontend
        shell: bash
        run: LOT_SKIP_CHECKER=1 bun run build

      - name: Install tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked || true

      - name: Initialize iOS project
        working-directory: workspace/m4-1-userApp-tauri
        shell: bash
        run: cargo tauri ios init --ci --skip-targets-install

      - name: Build iOS simulator app
        working-directory: workspace/m4-1-userApp-tauri
        shell: bash
        env:
          LOT_SKIP_FRONTEND_BUILD: "true"
        run: cargo tauri ios build --target aarch64-sim --ci

      - name: Package .app to .app.ipa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          app_path="$(find workspace/m4-1-userApp-tauri/gen/apple/build -type d -name '*.app' | head -1)"
          test -n "${app_path}"
          ditto -c -k --keepParent "${app_path}" "/tmp/release/${OUTPUT_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: m4-1-userApp-tauri-ios
          path: /tmp/release/${{ env.OUTPUT_NAME }}
          if-no-files-found: warn

      - name: Upload to private release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GH }}
        run: |
          set -euo pipefail
          bash .github/script/gh-release.sh upload \
            "${RELEASE_TAG}" \
            "${PRIVATE_RELEASE_REPO}" \
            /tmp/release/${{ env.OUTPUT_NAME }}
