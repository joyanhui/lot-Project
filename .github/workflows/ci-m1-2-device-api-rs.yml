name: CI M1-2 Device API Rs

# m1-2-device-api-rs 设备面模块：设备注册、回源（pullConfig/checkUpdate/节点分配）、
# 报警上报、固件下载代理、设备离线判断、通知派发（webhook/企业微信/电话）、告警事件推送 m1-1。
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要校验的 lot-manager-aio ref（分支 / tag / commit SHA）"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-m1-2-device-api-rs-${{ github.event.inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
    steps:
      - name: Checkout private workspace
        uses: actions/checkout@v4
        with:
          repository: joyanhui/lot-manager-aio
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch private workspace to requested ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lot-rust-host
          workspaces: |
            workspace -> target

      - name: Validate workspace metadata
        working-directory: workspace
        shell: bash
        run: cargo metadata --format-version 1 --no-deps

      - name: Check m1-2-device-api-rs
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          env -u CARGO_INCREMENTAL cargo check -p m1-2-device-api-rs

      - name: Run m1-2-device-api-rs tests
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          env -u CARGO_INCREMENTAL cargo test -p m1-2-device-api-rs
