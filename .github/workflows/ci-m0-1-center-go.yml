name: CI M0-1 Center

# m0-1-center-go 运行态中心：调度（节点注册心跳、节点分配、bitmap/root key 同步）、
# 配置中心（runtime_configs 快照与分发）、离线裁决、告警处理、通知派发、电话报警计费、
# 设备面 RPC（pullConfig/checkUpdate/固件下载代理）。

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "要校验的 lot-manager-aio ref（分支 / tag / commit SHA）"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ci-m0-1-center-go-${{ github.event.inputs.source_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
    steps:
      - name: Checkout private workspace
        uses: actions/checkout@v4
        with:
          repository: joyanhui/lot-manager-aio
          ref: main
          token: ${{ secrets.TOKEN_GH }}
          path: workspace
          fetch-depth: 0

      - name: Switch private workspace to requested ref
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${SOURCE_REF}^{commit}" >/dev/null; then
            git fetch origin "${SOURCE_REF}" --tags --force || git fetch origin --tags --force
          fi
          git checkout --detach "${SOURCE_REF}" || git checkout --detach "origin/${SOURCE_REF}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            workspace/go.work.sum
            workspace/lot-shared-lib/golang/go.sum
            workspace/m0-1-center-go/go.sum

      - name: Vet m0-1-center-go
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          go vet ./m0-1-center-go/... ./lot-shared-lib/golang/...

      - name: Build m0-1-center-go
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          go build ./m0-1-center-go/... ./lot-shared-lib/golang/...

      - name: Run m0-1-center-go tests
        working-directory: workspace
        shell: bash
        run: |
          set -euo pipefail
          go test ./m0-1-center-go/... ./lot-shared-lib/golang/...
