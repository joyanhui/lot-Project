<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面跳转中</title>
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f6f8; color: #73808a; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div>页面跳转中…</div>
<script>
(function () {
  var known = ["ops-ui", "web-ui"];
  var segs = (location.pathname || "/").split("/").filter(Boolean);
  for (var i = 0; i < segs.length; i++) {
    if (known.indexOf(segs[i]) !== -1) {
      location.replace("/" + segs.slice(0, i + 1).join("/") + "/");
      return;
    }
  }
  document.title = "Page not found";
  document.body.innerHTML = '<div style="font-family:system-ui;text-align:center;padding:3rem"><h1>404</h1><p>页面不存在或已移动。</p></div>';
})();
</script>
</body>
</html>
